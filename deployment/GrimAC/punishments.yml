# Optional enforcement starting profile for official GrimAC 2.3.74.
# Back up the old file and validate on staging before use. Never installed automatically.
# Group counts are cumulative inside each 300-second window. No permanent bans.
Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
    - Simulation
    - GroundSpoof
    - Timer
    - TimerLimit
    - NoFall
    commands:
    - 100:40 [alert]
    - 1:1 [log]
    - 150:0 kick %player% [Sentinel] Repeated Simulation violations; contact staff
      if this is unexpected.
  Knockback:
    remove-violations-after: 300
    checks:
    - Knockback
    - Explosion
    commands:
    - 5:5 [alert]
    - 1:1 [log]
    - 100:0 kick %player% [Sentinel] Repeated Knockback violations; contact staff
      if this is unexpected.
  Post:
    remove-violations-after: 300
    checks:
    - Post
    commands:
    - 20:20 [alert]
    - 1:1 [log]
  BadPackets:
    remove-violations-after: 300
    checks:
    - BadPackets
    - PacketOrder
    - Crash
    commands:
    - 20:20 [alert]
    - 1:1 [log]
    - 100:0 kick %player% [Sentinel] Repeated BadPackets violations; contact staff
      if this is unexpected.
  Reach:
    remove-violations-after: 300
    checks:
    - Reach
    commands:
    - 1:1 [alert]
    - 1:1 [log]
    - 30:0 kick %player% [Sentinel] Repeated Reach violations; contact staff if this
      is unexpected.
  Hitboxes:
    remove-violations-after: 300
    checks:
    - Hitboxes
    commands:
    - 5:3 [alert]
    - 1:1 [log]
    - 60:0 kick %player% [Sentinel] Repeated Hitboxes violations; contact staff if
      this is unexpected.
  Misc:
    remove-violations-after: 300
    checks:
    - Vehicle
    - NoSlow
    - Sprint
    - MultiActions
    - Place
    - Baritone
    - Break
    - TransactionOrder
    - Elytra
    - Chat
    - Exploit
    commands:
    - 10:5 [alert]
    - 1:1 [log]
  Combat:
    remove-violations-after: 300
    checks:
    - Interact
    - Aim
    commands:
    - 20:40 [alert]
    - 1:1 [log]
  Autoclicker:
    remove-violations-after: 300
    checks:
    - Autoclicker
    commands:
    - 20:40 [alert]
    - 1:1 [log]
