# ==============================================================================
#  SENTINEL AC — MAXIMAL PUNISHMENT CONFIGURATION (Jazo Tizimi)
# ==============================================================================
# %check_name% - qoidabuzarlik nomi
# %description% - qoidabuzarlik tavsifi
# %vl% - qoidabuzarlik soni (violation level)
# %verbose% - batafsil ma'lumot
# %player% - o'yinchi nomi
# [alert] - moderatorlarga ogohlantirish yuborish
# [webhook] - discord kanalga webhook xabari yuborish
# [proxy] - velocity/bungeecord orqali barcha serverlarga xabar

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "15:10 [alert]"
      - "1:1 [log]"
      - "25:25 [webhook]"
      - "35:0 kick %player% &#FF416C[SENTINEL AC HIMOYASI]
&#E2E8F0Noqonuniy harakat (Fly/Speed/Timer) aniqlandi!"
      - "80:0 ban %player% 7d &#FF416C[SENTINEL AC]
&#E2E8F0Noqonuniy harakat (Cheat/Hack) tufayli 7 kunga bloklandingiz!"

