name: SentinelAC
version: '${project.version}'
main: uz.sentinel.ac.SentinelPlugin
description: Paper 26.2 enforcement and diagnostics with the official GrimAC engine
authors: [azicoo]
website: https://github.com/dilmuratovv/SentinelAC
api-version: '26.2'
depend: [GrimAC]
softdepend: [ViaVersion, ViaBackwards, floodgate]
commands:
  sentinel:
    description: SentinelAC boshqaruvi
    aliases: [sac, sentinelac]
permissions:
  sentinel.admin:
    default: op
    children:
      sentinel.alerts: true
      sentinel.profile: true
      sentinel.performance: true
      sentinel.history: true
      sentinel.reload: true
      sentinel.info: true
  sentinel.alerts:
    default: op
    children:
      grim.alerts: true
      grim.alerts.enable-on-join: true
  sentinel.profile:
    default: op
    children:
      grim.profile: true
  sentinel.performance:
    default: op
    children:
      grim.performance: true
  sentinel.history:
    default: op
  sentinel.reload:
    default: op
  sentinel.info:
    default: op
  sentinel.exempt:
    description: Sentinel qoidalari va Grim tekshiruvlaridan ozod qiladi
    default: false
    children:
      grim.exempt: true
