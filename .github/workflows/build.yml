name: Build, verify and release the single Paper JAR
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # One JAR, compiled once against the oldest supported Paper API (1.21, Java 21 bytecode).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B -ntp clean verify
      - name: Inspect identity, resources and bytecode
        run: python3 tools/verify_artifact.py
      - name: Summarize unit tests
        run: python3 tools/unit_test_summary.py plugin/target/unit-tests.json
      - name: Extract the platform API the JAR links against
        run: python3 tools/api_compat.py --extract-only --jar plugin/target/SentinelAC-*-paper.jar --refs-cache plugin/target/api-refs.tsv
      - name: Collect the release candidate
        run: |
          mkdir -p dist
          cp plugin/target/SentinelAC-*-paper.jar plugin/target/unit-tests.json plugin/target/api-refs.tsv dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SentinelAC-jar
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-test-reports
          path: plugin/target/surefire-reports/*.txt
          if-no-files-found: warn
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      publish: ${{ steps.targets.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: targets
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          entries = json.loads(Path('tools/server-matrix.json').read_text())['servers']
          priority = ['26.3', '1.21', '26.1.1', '1.21.11']
          entries.sort(key=lambda e: priority.index(e['version']) if e['version'] in priority else len(priority))
          targets = {'include': [{'target': e['version'], 'java': str(e['java'])} for e in entries]}
          current = json.loads(Path('release.json').read_text())
          previous = subprocess.run(['git', 'show', 'HEAD^:release.json'], text=True, capture_output=True, check=False)
          prior = json.loads(previous.stdout) if previous.returncode == 0 else {}
          release_changed = (current['version'], current['tag']) != (prior.get('version'), prior.get('tag'))
          publish = os.environ['GITHUB_REF'] == 'refs/heads/main' and ((os.environ['GITHUB_EVENT_NAME'] == 'push' and release_changed) or os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(targets) + '\n')
              output.write('publish=' + str(publish).lower() + '\n')
  # The same JAR must link against and boot on every supported Paper version.
  verify:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: SentinelAC-jar
          path: dist
      - name: Check the JAR links against Paper ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mvn -B -ntp -q -f tools/api-classpath/pom.xml dependency:build-classpath -Dpaper.version="$(python3 tools/paper_version.py 1.21)" -Dmdep.outputFile="$PWD/baseline.txt"
          mvn -B -ntp -q -f tools/api-classpath/pom.xml dependency:build-classpath -Dpaper.version="$(python3 tools/paper_version.py "$TARGET")" -Dmdep.outputFile="$PWD/target.txt"
          python3 tools/api_compat.py --jar dist/SentinelAC-*-paper.jar --refs-cache dist/api-refs.tsv --java "$JAVA_HOME/bin/java" --baseline-classpath "$(cat baseline.txt)" --classpath "$(cat target.txt)"
      - run: npm ci --prefix tools/client --no-audit --no-fund
      - name: Verify isolated native and Via servers
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tools/smoke_target.py --target "$TARGET" --jar dist/SentinelAC-*-paper.jar --unit-tests dist/unit-tests.json --java "$JAVA_HOME/bin/java" --accept-eula --client-probes
      - name: Collect the verification report
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p report
          cp "target/matrix-smoke/$TARGET/verification.json" "report/verification-paper$TARGET.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-paper-${{ matrix.target }}
          path: report/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-paper-${{ matrix.target }}
          path: target/matrix-smoke/${{ matrix.target }}/**/smoke-output.log
          if-no-files-found: warn
  publish:
    needs: [matrix, build, verify]
    if: needs.matrix.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: SentinelAC-jar
          path: jar
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verification-paper-*
          path: release-assets
          merge-multiple: true
      - name: Gather the JAR
        run: cp jar/SentinelAC-*-paper.jar release-assets/
      - name: Publish only after every target passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py
