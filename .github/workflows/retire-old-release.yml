name: Retire superseded Paper 26.2 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-old-release.yml']
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify replacement before deleting the exact old release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'dilmuratovv/SentinelAC'
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def api(method, path, missing_ok=False):
              request = urllib.request.Request(base + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'SentinelAC-authorized-release-cleanup'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                      return json.loads(data) if data else None
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise
          replacement = api('GET', '/releases/tags/v2.6.0')
          assert replacement['id'] == 428426626 and not replacement['draft'] and not replacement['prerelease']
          assert api('GET', '/releases/latest')['id'] == replacement['id']
          versions = ['1.21', '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1.1', '26.1.2', '26.2', '26.3']
          assets = {asset['name']: asset for asset in replacement['assets']}
          expected = {'SentinelAC-2.6.0-paper' + version + '.jar' for version in versions} | {'SHA256SUMS.txt', 'VERIFICATION.json'}
          assert set(assets) == expected
          assert all(asset['state'] == 'uploaded' and asset['size'] > 0 and asset.get('digest', '').startswith('sha256:') for asset in assets.values())
          assert assets['SentinelAC-2.6.0-paper26.2.jar']['digest'] == 'sha256:cac2cbe15ccbceceab724164604ec9698796b6e3c20c0a1e888efc0a8ed61337'
          assert api('GET', '/git/ref/tags/v2.6.0')['object']['sha'] == 'f9ebd782bcfac763f213c20fa0ff752422cbecbc'
          old_tag = api('GET', '/git/ref/tags/v2.5.0-paper26.2', missing_ok=True)
          if old_tag:
              assert old_tag['object']['sha'] == 'd35c1b62a753c37fe1900ace5d483cd1cc3587d8'
          old = api('GET', '/releases/tags/v2.5.0-paper26.2', missing_ok=True)
          if old:
              assert old['id'] == 428164388 and old['tag_name'] == 'v2.5.0-paper26.2'
              api('DELETE', '/releases/' + str(old['id']))
              print('Deleted superseded release and its attached assets: v2.5.0-paper26.2')
          if old_tag:
              api('DELETE', '/git/refs/tags/v2.5.0-paper26.2')
              print('Deleted superseded tag: v2.5.0-paper26.2')
          assert api('GET', '/releases/tags/v2.5.0-paper26.2', missing_ok=True) is None
          assert api('GET', '/git/ref/tags/v2.5.0-paper26.2', missing_ok=True) is None
          latest = api('GET', '/releases/latest')
          assert latest['id'] == replacement['id'] and latest['assets'] == replacement['assets']
          print('Verified v2.6.0 remains latest with all 15 JARs and both verification files intact.')
